[project]
name = "vep-arena"
version = "0.1.0"
description = "Clean VEP/SSVEP benchmark arena"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "pandas",
  "matplotlib",
  "pooch>=1.9.0",
  "mat73>=0.65",
  "py7zr>=1.1.3",
  "h5py>=3.16.0",
  "tqdm>=4.68.3",
]

[project.optional-dependencies]
torch = [
  "torch>=2.7",
]
neuro = [
  "mne>=1.8",
  "moabb>=1.1",
]
reports = [
  "python-pptx>=1.0.2",
]
all = [
  "vep-arena[torch,neuro,reports]",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
